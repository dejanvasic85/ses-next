name: CI

on:
  push:
    branches-ignore:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-preview:
    name: Verify
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-jammy
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
      statuses: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type:check

      - name: Wait for Vercel deployment
        id: vercel-deployment
        uses: vercel/wait-for-deployment-action@0e2b0c5c5cce31f1648108aeec56467187aca037 # main
        with:
          environment: preview
          timeout: 300
          check-interval: 10

      - name: Run Playwright tests
        run: pnpm --filter ses-next test:e2e
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.vercel-deployment.outputs.deployment-url }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          HOME: /root

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/ses-next/playwright-report/
          retention-days: 7
